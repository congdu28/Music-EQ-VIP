name: Build and Release Music EQ APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Restore or Generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Debug keystore restored from base64."
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > debug.keystore.base64
          echo "Debug keystore generated and saved to debug.keystore.base64."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug.keystore.base64
          git commit -m "ci: persist permanent debug keystore for seamless app updates [skip ci]" || true
          git push origin HEAD:main || true
        fi

    - name: Build Android Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace --no-daemon > gradle_build.log 2>&1 || {
          EXIT_CODE=$?
          echo "==================== BUILD FAILURE DETECTED ===================="
          tail -n 120 gradle_build.log
          exit $EXIT_CODE
        }

    - name: Upload Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: gradle_build.log

    - name: Rename APK for Release
      run: |
        mkdir -p release-output
        echo "Listing all files in app/build/outputs:"
        find app/build/outputs -type f || true
        echo "Searching for APK files across entire workspace:"
        find . -name "*.apk" || true
        APK_PATH=$(find . -name "*.apk" -not -path "*/build/intermediates/*" -not -path "*androidTest*" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find . -name "*.apk" | head -n 1)
        fi
        if [ -n "$APK_PATH" ]; then
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-output/MusicEQ-v1.0.3.apk
          ls -la release-output/
        else
          echo "ERROR: No APK found anywhere in workspace!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicEQ-APK
        path: release-output/MusicEQ-v1.0.3.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.3' }}
        name: Release Music EQ ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.3' }}
        draft: false
        prerelease: false
        body: |
          ### 🎵 Music EQ v1.0.3 - Tích hợp Gemini AI & Tìm kiếm Lời bài hát Karaoke LRC

          **Có gì mới trong phiên bản v1.0.3:**
          - 🤖 **Tích hợp Gemini AI tạo lời Karaoke LRC tự động**:
            - Hỗ trợ model `gemini-3.5-flash` và `gemini-flash-latest` với tốc độ phản hồi cực nhanh.
            - Tự động sinh toàn bộ lời bài hát chuẩn timestamp `[mm:ss.xx]` phân bổ đều theo thời lượng bài hát thực tế.
            - Tích hợp cấu hình API Key trong màn hình **Cài đặt** (Settings), có thể tùy chỉnh hoặc khôi phục mặc định bất kỳ lúc nào.
          - 🔍 **Tìm kiếm nhanh trên Google (Google Search Fallback)**:
            - Bổ sung nút mở tìm kiếm Google trực tiếp từ menu "Tìm Lời" trong màn hình Đang phát & màn hình Lời bài hát.
          - 📋 **Dán & Tự động tạo mốc LRC từ bộ nhớ tạm (Clipboard)**:
            - Trong hộp thoại "Sửa LRC", bổ sung nút **"Dán & Tạo mốc LRC"**: Nếu lời bài hát copy từ web không có sẵn timestamp, ứng dụng sẽ tự động phân bổ mốc thời gian chuẩn xác để hát Karaoke ngay lập tức.
          - 🔄 **Khả năng cài đặt đè mượt mà (In-place Upgrade)**:
            - Cố định khóa ký vĩnh viễn (Persistent Keystore) giúp cập nhật từ v1.0.2 lên v1.0.3 đè lên bình thường mà không cần gỡ cài đặt app cũ.
        files: release-output/MusicEQ-v1.0.3.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
