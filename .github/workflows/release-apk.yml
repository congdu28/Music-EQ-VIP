name: Build and Release Music EQ APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Restore Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Debug keystore restored successfully."
        fi

    - name: Build Android Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Rename APK for Release
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/MusicEQ-v1.0.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicEQ-APK
        path: release-output/MusicEQ-v1.0.0.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
        name: Release Music EQ v1.0.0
        draft: false
        prerelease: false
        body: |
          ### 🎵 Music EQ - Hi-Res Audio Player & 10-Band System Equalizer
          
          **Phiên bản phát hành v1.0.0:**
          - 🎶 Bộ chỉnh âm Equalizer 10 dải tần độc lập hỗ trợ toàn hệ thống và ứng dụng bên thứ 3.
          - 🎤 Lời bài hát Karaoke LRC đồng bộ thời gian thực mượt mà.
          - 🚀 Bộ điều khiển tốc độ phát nhạc tùy chỉnh vi mô (0.50x đến 2.50x).
          - 📱 Giao diện thư viện tối ưu siêu gọn, hiển thị 8+ bài hát trên màn hình.
          - 🇻🇳 Hỗ trợ 100% tiếng Việt chuẩn có dấu với typography Be Vietnam Pro.
        files: release-output/MusicEQ-v1.0.0.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
