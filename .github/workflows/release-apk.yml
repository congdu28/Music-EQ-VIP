name: Build and Release Music EQ APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Restore or Generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Debug keystore restored from base64."
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > debug.keystore.base64
          echo "Debug keystore generated and saved to debug.keystore.base64."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug.keystore.base64
          git commit -m "ci: persist permanent debug keystore for seamless app updates [skip ci]" || true
          git push origin HEAD:main || true
        fi

    - name: Build Android Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log
        BUILD_STATUS=${PIPESTATUS[0]}
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "==================== BUILD FAILURE DETECTED ===================="
          tail -n 200 gradle_build.log
          exit $BUILD_STATUS
        fi

    - name: Upload Build Log On Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: gradle_build.log

    - name: Rename APK for Release
      run: |
        mkdir -p release-output
        VERSION_TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.30' }}"
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        if [ -n "$APK_PATH" ]; then
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "release-output/MusicEQ-${VERSION_TAG}.apk"
          ls -la release-output/
        else
          echo "ERROR: No APK found anywhere in workspace!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicEQ-APK
        path: release-output/*.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.30' }}
        name: Release Music EQ ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.30' }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: release-output/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
