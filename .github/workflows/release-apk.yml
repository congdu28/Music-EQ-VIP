name: Build and Release Music EQ APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Restore or Generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "Debug keystore restored from base64."
        elif [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > debug.keystore.base64
          echo "Debug keystore generated and saved to debug.keystore.base64."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug.keystore.base64
          git commit -m "ci: persist permanent debug keystore for seamless app updates [skip ci]" || true
          git push origin HEAD:main || true
        fi

    - name: Build Android Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Rename APK for Release
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/MusicEQ-v1.0.1.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicEQ-APK
        path: release-output/MusicEQ-v1.0.1.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
        name: Release Music EQ ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
        draft: false
        prerelease: false
        body: |
          ### 🎵 Music EQ v1.0.1 - Hi-Res Audio Player & 10-Band Equalizer

          **Có gì mới trong phiên bản v1.0.1:**
          - 🔄 **Cập nhật ghi đè (In-place update)**: Chuẩn hóa chữ ký số Keystore cố định và nâng `versionCode = 2`, cho phép cài đè trực tiếp các bản cập nhật tiếp theo mà không cần gỡ ứng dụng cũ.
          - 🎧 **MediaSession & Lockscreen Controls**: Hỗ trợ đầy đủ điều khiển nhạc trên màn hình khóa, thanh thông báo trạng thái MediaStyle và phím cứng tai nghe/Bluetooth (Play/Pause/Next/Prev).
          - 🔇 **AudioFocus Handling**: Tự động giảm âm lượng hoặc tạm dừng khi có cuộc gọi đến / ứng dụng khác phát âm thanh và tự phát lại mượt mà khi kết thúc.
          - 🎚️ **Loudness Enhancer & Preset Reverb**: Tăng cường âm lượng thông minh cho tai nghe công suất nhỏ và bổ sung hiệu ứng vang phòng/sân khấu sống động.
          - ⚡ **Pre-Amp Limiter**: Tinh chỉnh biên độ âm thanh đầu vào (-12dB đến 0dB), chống vỡ tiếng tuyệt đối khi boost bass/treble cao.
          - 🚀 **Hiệu năng & Pin tối ưu**: Cơ chế adaptive polling thông minh giúp tiết kiệm pin khi chạy nền và visualizer vẽ trực tiếp trên canvas 60fps.

          *(Lưu ý: Nếu bạn đang cài bản chạy thử nghiệm ban đầu từ Google AI Studio, vui lòng gỡ bỏ bản cũ này 1 lần duy nhất để đồng bộ chữ ký Keystore của repo; từ bản v1.0.1 này trở đi, tất cả các bản cập nhật mới sẽ cài đè bình thường).*
        files: release-output/MusicEQ-v1.0.1.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
